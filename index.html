const book=document.getElementById('book'), stage=document.getElementById('stage');
let cur=Math.max(1,Math.min(14,+(location.hash.match(/page=(\d+)/)||[0,1])[1]));
function size(){ const m=innerWidth<800; const ww=stage.clientWidth-(m?16:150), hh=stage.clientHeight-(m?10:30);
  const pw=Math.min(ww, hh*R); return {pw, ph:pw/R}; }
function pageEl(p,s){ const d=document.createElement('div'); d.className='pg'; d.style.width=s.pw+'px'; d.style.height=s.ph+'px';
  d.innerHTML='<img alt="Page '+p+'" src="pages/'+String(p).padStart(2,'0')+'.jpg">';
  (L[p]||[]).forEach(([x,y,w,h,u])=>{ const a=document.createElement('a'); a.className='hs'; a.style.left=x*100+'%'; a.style.top=y*100+'%'; a.style.width=w*100+'%'; a.style.height=h*100+'%';
    if(u.startsWith('#p')){ a.href='#'; a.onclick=e=>{e.preventDefault(); go(+u.slice(2));}; } else { a.href=u; a.target='_blank'; a.rel='noopener'; }
    a.title=u.startsWith('#p')?'Aller à la page '+u.slice(2):'Ouvrir sur le site'; a.setAttribute('aria-label',a.title); d.appendChild(a); });
  return d; }
function render(){ const s=size(); book.innerHTML=''; book.appendChild(pageEl(cur,s));
  document.getElementById('lbl').textContent='Page '+cur+' / '+N; document.getElementById('rg').value=cur; document.getElementById('prev').disabled=cur<=1; document.getElementById('next').disabled=cur>=N;
  for(const q of [cur-1,cur+1,cur+2]) if(q>0&&q<=N){ const i=new Image(); i.src='pages/'+String(q).padStart(2,'0')+'.jpg'; } }
let busy=false;
function turn(dir){ const t=cur+dir; if(t<1||t>N||busy) return; busy=true; const s=size();
  const f=document.createElement('div'); f.className='flip'; f.style.width=s.pw+'px'; f.style.left='0';
  const top= dir>0?cur:t, under= dir>0?t:cur;
  f.innerHTML='<div class="f"><img src="pages/'+String(top).padStart(2,'0')+'.jpg"></div>';
  f.style.transformOrigin='left center'; f.style.transition='transform .65s cubic-bezier(.3,.7,.3,1), opacity .65s';
  book.innerHTML=''; book.appendChild(pageEl(under,s)); book.appendChild(f);
  if(dir<0){ f.style.transform='rotateY(-110deg)'; f.style.opacity='0'; }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(dir>0){ f.style.transform='rotateY(-110deg)'; f.style.opacity='0'; } else { f.style.transform='rotateY(0deg)'; f.style.opacity='1'; } }));
  setTimeout(()=>{ cur=t; render(); busy=false; },660); }
function go(p){ cur=Math.max(1,Math.min(N,p)); render(); }
document.getElementById('next').onclick=()=>turn(1); document.getElementById('prev').onclick=()=>turn(-1);
document.getElementById('rg').oninput=e=>go(+e.target.value);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') turn(1); if(e.key==='ArrowLeft') turn(-1); });
let x0=null; stage.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) turn(dx<0?1:-1); x0=null; });
addEventListener('resize',render); render();
document.getElementById('aide').onclick=()=>{document.body.classList.add('aide'); setTimeout(()=>document.body.classList.remove('aide'),3400);};
if(matchMedia('(hover:none)').matches){document.body.classList.add('aide'); setTimeout(()=>document.body.classList.remove('aide'),3400);}
